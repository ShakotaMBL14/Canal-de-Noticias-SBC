name: Bot noticias SBC
on:
  schedule:
    - cron: "*/50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests googlenewsdecoder "selectolax<1.0"
      - run: python bot.py
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
      - name: Salvar historico
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add postados.json
          git diff --cached --quiet || (git commit -m "atualiza historico" && git push)
